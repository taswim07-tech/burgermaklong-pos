<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Burger Maklong — Sistem POS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1E1A15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Burger Maklong">
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
<style>
  :root{
    --bg:#1E1A15;
    --bg-alt:#26201A;
    --surface:#FFF8EC;
    --surface-soft:#FBF1DF;
    --ink:#241B12;
    --ink-soft:#7A6A57;
    --mustard:#E8A93A;
    --mustard-deep:#C98A1F;
    --tomato:#C1442E;
    --tomato-deep:#9E3423;
    --green:#6F8C4E;
    --green-deep:#54692F;
    --line:rgba(36,27,18,.14);
    --line-soft:rgba(255,248,236,.14);
    --shadow:0 10px 30px rgba(15,10,5,.35);
    --radius-s:10px;
    --radius-m:16px;
    --radius-l:24px;
    --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;font-family:var(--ff);background:var(--bg);
    color:var(--surface);min-height:100vh;overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--mustard);color:var(--ink);}

  /* ===== Header ===== */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg,var(--bg) 0%, rgba(30,26,21,.98) 100%);
    border-bottom:1px solid var(--line-soft);
    padding:10px 16px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;margin-left:10px;}
  .brand-mark{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(155deg,var(--mustard),var(--tomato));
    display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:0 4px 12px rgba(193,68,46,.35);
  }
  .brand-text h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px;line-height:1.1;}
  .brand-text span{font-size:11px;color:#C9BBA6;letter-spacing:.2px;}
  .clock{font-size:12px;color:#C9BBA6;text-align:right;white-space:nowrap;flex:none;}
  .clock b{display:block;color:var(--surface);font-size:14px;font-weight:700;}

  .tabs{display:flex;gap:6px;margin-top:10px;background:var(--bg-alt);padding:4px;border-radius:14px;}
  .tab-btn{
    flex:1;border:none;background:transparent;color:#C9BBA6;
    padding:10px 8px;border-radius:11px;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background .18s ease,color .18s ease;
  }
  .tab-btn.active{background:var(--mustard);color:var(--ink);}
  .tab-btn .badge{
    background:var(--tomato);color:#fff;border-radius:999px;font-size:10px;
    padding:1px 6px;font-weight:800;min-width:16px;text-align:center;
  }
  .tab-btn.active .badge{background:var(--tomato);color:#fff;}

  .view{display:none;padding:14px 16px 90px;max-width:1300px;margin:0 auto;}
  .view.active{display:block;}

  /* ===== POS layout ===== */
  .pos-layout{display:flex;flex-direction:column;gap:14px;}
  .search-row{display:flex;gap:8px;}
  .search-box{
    flex:1;display:flex;align-items:center;gap:8px;background:var(--bg-alt);
    border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;
  }
  .search-box input{
    flex:1;background:transparent;border:none;outline:none;color:var(--surface);font-size:14px;
  }
  .search-box input::placeholder{color:#8A7B69;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .chip{
    flex:none;border:1px solid var(--line-soft);background:var(--bg-alt);color:#D8CBB7;
    padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;
    transition:all .15s ease;
  }
  .chip.active{background:var(--mustard);border-color:var(--mustard);color:var(--ink);}

  .product-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:2px;
  }
  .product-card{
    background:var(--surface);border-radius:var(--radius-m);padding:12px;text-align:left;
    border:1px solid rgba(36,27,18,.06);position:relative;overflow:hidden;
    box-shadow:0 2px 0 rgba(0,0,0,.04);transition:transform .12s ease, box-shadow .12s ease;
    min-height:118px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .product-card:active{transform:scale(.96);}
  .product-card .tag{
    position:absolute;top:10px;right:10px;font-size:9px;font-weight:800;letter-spacing:.3px;
    padding:3px 7px;border-radius:999px;
  }
  .tag.burger{background:rgba(193,68,46,.12);color:var(--tomato-deep);}
  .tag.minuman{background:rgba(111,140,78,.14);color:var(--green-deep);}
  .product-card h3{margin:0;font-size:14px;color:var(--ink);font-weight:800;line-height:1.25;padding-right:34px;}
  .product-card p.desc{margin:4px 0 0;font-size:11.5px;color:var(--ink-soft);line-height:1.3;}
  .product-card .price-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .product-card .price{font-size:15px;font-weight:800;color:var(--tomato-deep);}
  .add-fab{
    width:30px;height:30px;border-radius:9px;border:none;background:var(--ink);color:var(--mustard);
    font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:0;
  }
  .empty-state{padding:40px 16px;text-align:center;color:#B7A98F;font-size:13px;}
  .empty-state .ic{font-size:34px;display:block;margin-bottom:8px;}

  /* ===== Cart (desktop side panel / mobile drawer) ===== */
  .cart-panel{
    background:var(--surface);color:var(--ink);border-radius:var(--radius-l) var(--radius-l) 0 0;
    display:flex;flex-direction:column;
  }
  .cart-header{
    padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .cart-header h2{margin:0;font-size:15px;font-weight:800;}
  .cart-header .clear-btn{border:none;background:none;color:var(--tomato-deep);font-size:12px;font-weight:700;}
  .cart-items{flex:1;overflow-y:auto;padding:8px 14px;max-height:38vh;}
  .cart-item{
    display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);
  }
  .cart-item:last-child{border-bottom:none;}
  .cart-item .ci-main{flex:1;min-width:0;}
  .cart-item .ci-name{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px;}
  .cart-item .ci-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cart-item .ci-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .cart-item .ci-note{font-size:11px;color:var(--tomato-deep);margin-top:2px;font-style:italic;}
  .ci-controls{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .qty-stepper{display:flex;align-items:center;gap:0;background:var(--surface-soft);border-radius:9px;overflow:hidden;}
  .qty-stepper button{width:28px;height:28px;border:none;background:transparent;font-size:16px;font-weight:800;color:var(--ink);}
  .qty-stepper span{min-width:22px;text-align:center;font-size:13px;font-weight:800;}
  .ci-actions{display:flex;gap:6px;}
  .icon-btn{
    border:none;background:var(--surface-soft);width:28px;height:28px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink);
  }
  .icon-btn.danger{color:var(--tomato-deep);}
  .ci-linetotal{font-size:13px;font-weight:800;white-space:nowrap;}

  .cart-note-row{padding:10px 16px 0;}
  .cart-note-row label{font-size:11px;font-weight:700;color:var(--ink-soft);}
  .cart-note-row textarea{
    width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    font-size:12.5px;resize:none;background:var(--surface-soft);color:var(--ink);min-height:36px;
  }
  .cart-footer{padding:12px 16px 16px;border-top:1px solid var(--line);}
  .total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .total-row .lbl{font-size:13px;color:var(--ink-soft);font-weight:700;}
  .total-row .val{font-size:22px;font-weight:800;color:var(--ink);}
  .pay-btn{
    border:none;background:var(--tomato);color:#fff;padding:14px;border-radius:14px;
    font-size:14px;font-weight:800;box-shadow:0 6px 16px rgba(193,68,46,.35);flex:1.7;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .pay-btn:disabled{background:#D8CBB7;color:#8A7B69;box-shadow:none;}
  .cart-footer-actions{display:flex;gap:8px;}
  .hold-btn{
    flex:1;border:1.5px dashed var(--ink-soft);background:var(--surface-soft);color:var(--ink);
    padding:8px 6px;border-radius:14px;font-size:12px;font-weight:800;line-height:1.5;text-align:center;
  }
  .hold-btn:disabled{opacity:.4;}
  .pending-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(135deg,rgba(232,169,58,.16),rgba(193,68,46,.10));
    border:1px solid rgba(232,169,58,.35);border-radius:14px;padding:11px 14px;margin-bottom:10px;
    font-size:12.5px;font-weight:700;color:var(--surface);
  }
  .pending-banner b{color:var(--mustard);}
  .pending-banner button{border:none;background:var(--mustard);color:var(--ink);padding:7px 12px;border-radius:9px;font-size:11.5px;font-weight:800;flex:none;}

  .cart-fab{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;
    background:var(--ink);color:var(--mustard);border:none;padding:13px 22px;border-radius:999px;
    font-weight:800;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.4);
    display:flex;align-items:center;gap:10px;
  }
  .cart-fab .n{background:var(--tomato);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;}

  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(10,7,4,.55);z-index:60;display:none;
  }
  .drawer-backdrop.open{display:block;}
  .cart-drawer-wrap{
    position:fixed;left:0;right:0;bottom:0;z-index:61;
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:88vh;
  }
  .cart-drawer-wrap.open{transform:translateY(0);}
  .drawer-handle{display:flex;justify-content:center;padding:8px 0 2px;background:var(--surface);border-radius:var(--radius-l) var(--radius-l) 0 0;}
  .drawer-handle span{width:38px;height:4px;border-radius:99px;background:#D8CBB7;}

  /* ===== Modals ===== */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,7,4,.6);z-index:100;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-backdrop.open{display:flex;}
  .modal-card{
    background:var(--surface);color:var(--ink);width:100%;max-width:480px;
    border-radius:var(--radius-l) var(--radius-l) 0 0;max-height:92vh;overflow-y:auto;
    animation:slideUp .22s cubic-bezier(.32,.72,0,1);
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  @media(min-width:720px){
    .modal-backdrop{align-items:center;}
    .modal-card{border-radius:var(--radius-l);}
  }
  .modal-head{
    display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;
    position:sticky;top:0;background:var(--surface);z-index:2;
  }
  .modal-head h3{margin:0;font-size:16px;font-weight:800;}
  .modal-close{border:none;background:var(--surface-soft);width:30px;height:30px;border-radius:9px;font-size:15px;color:var(--ink);}
  .modal-body{padding:6px 18px 18px;}

  .field-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;text-transform:none;}
  .qty-editor{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--surface-soft);border-radius:14px;padding:14px;}
  .qty-editor button{width:42px;height:42px;border-radius:12px;border:none;background:var(--ink);color:var(--mustard);font-size:20px;font-weight:800;}
  .qty-editor .qn{font-size:22px;font-weight:800;min-width:34px;text-align:center;}

  .addon-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .addon-row{
    display:flex;align-items:center;justify-content:space-between;padding:11px 12px;
    background:var(--surface-soft);border-radius:12px;border:1.5px solid transparent;
  }
  .addon-row.checked{border-color:var(--mustard);background:#FCEFD3;}
  .addon-row .al{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;}
  .addon-row .price{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .fake-checkbox{
    width:20px;height:20px;border-radius:6px;border:2px solid #D8CBB7;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;flex:none;
  }
  .addon-row.checked .fake-checkbox{background:var(--mustard);border-color:var(--mustard);color:var(--ink);}

  textarea.note-input{
    width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;
    min-height:56px;resize:none;background:var(--surface-soft);color:var(--ink);
  }
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;border:none;padding:13px;border-radius:13px;font-weight:800;font-size:14px;
  }
  .btn.primary{background:var(--tomato);color:#fff;}
  .btn.dark{background:var(--ink);color:var(--mustard);}
  .btn.ghost{background:var(--surface-soft);color:var(--ink);}
  .btn.outline-danger{background:#FBE4DF;color:var(--tomato-deep);}
  .btn:disabled{opacity:.45;}

  /* payment modal */
  .pay-tabs{display:flex;gap:8px;background:var(--surface-soft);padding:4px;border-radius:12px;margin-top:8px;}
  .pay-tab{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink-soft);}
  .pay-tab.active{background:var(--ink);color:var(--mustard);}
  .pay-total-box{
    background:linear-gradient(155deg,#2A2117,#1E1A15);color:#fff;border-radius:16px;padding:16px;margin-top:14px;text-align:center;
  }
  .pay-total-box .l{font-size:11px;color:#C9BBA6;font-weight:700;letter-spacing:.3px;}
  .pay-total-box .v{font-size:30px;font-weight:800;color:var(--mustard);margin-top:2px;}
  .quick-amounts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .quick-amounts button{
    flex:1;min-width:70px;border:1px solid var(--line);background:var(--surface-soft);color:var(--ink);
    padding:10px 6px;border-radius:10px;font-weight:700;font-size:12.5px;
  }
  .cash-input-row{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--surface-soft);border-radius:12px;padding:10px 14px;}
  .cash-input-row span.rm{font-weight:800;color:var(--ink-soft);}
  .cash-input-row input{flex:1;border:none;background:transparent;font-size:18px;font-weight:800;color:var(--ink);outline:none;}
  .change-box{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:12px 14px;border-radius:12px;background:#EAF1E1;}
  .change-box.insufficient{background:#FBE4DF;}
  .change-box .l{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .change-box .v{font-size:17px;font-weight:800;color:var(--green-deep);}
  .change-box.insufficient .v{color:var(--tomato-deep);}

  .qr-wrap{display:flex;flex-direction:column;align-items:center;margin-top:14px;}
  .qr-code{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow);}
  .qr-grid{display:grid;gap:2px;}
  .qr-cell{width:7px;height:7px;}
  .qr-caption{font-size:12px;color:var(--ink-soft);margin-top:10px;text-align:center;}

  /* Receipt */
  .receipt-paper{
    background:#fff;color:#222;font-family:'Courier New',Courier,monospace;font-size:12.5px;
    padding:18px 16px;border-radius:10px;line-height:1.55;
  }
  .receipt-paper h4{margin:0;text-align:center;font-size:15px;letter-spacing:1px;}
  .receipt-paper .center{text-align:center;}
  .receipt-paper hr{border:none;border-top:1px dashed #999;margin:8px 0;}
  .rline{display:flex;justify-content:space-between;gap:8px;}
  .rline .l{flex:1;}
  .r-item-name{font-weight:700;}
  .r-sub{padding-left:8px;color:#555;font-size:11.5px;}

  /* ===== Transaksi ===== */
  .filter-card{
    background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:16px;padding:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-row .fitem{flex:1;min-width:130px;}
  .filter-row label{font-size:10.5px;color:#B7A98F;font-weight:700;display:block;margin-bottom:4px;}
  .filter-row input, .filter-row select{
    width:100%;background:var(--bg);border:1px solid var(--line-soft);color:var(--surface);
    padding:9px 10px;border-radius:9px;font-size:12.5px;outline:none;
  }
  .reset-filter{border:none;background:none;color:var(--mustard);font-size:12px;font-weight:700;align-self:flex-end;padding:6px 0;}
  .tx-summary{display:flex;gap:10px;margin:12px 0;}
  .tx-summary .box{flex:1;background:var(--bg-alt);border-radius:14px;padding:12px;border:1px solid var(--line-soft);}
  .tx-summary .box .n{font-size:18px;font-weight:800;color:var(--mustard);}
  .tx-summary .box .l{font-size:10.5px;color:#B7A98F;margin-top:2px;}
  .tx-list{display:flex;flex-direction:column;gap:8px;}
  .tx-row{
    background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .tx-row .tx-left{min-width:0;}
  .tx-row .tx-id{font-size:13px;font-weight:800;color:var(--surface);}
  .tx-row .tx-meta{font-size:11px;color:#B7A98F;margin-top:3px;}
  .tx-row .tx-method{
    display:inline-block;margin-top:5px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;
  }
  .tx-method.cash{background:rgba(111,140,78,.2);color:#A9C98A;}
  .tx-method.qr{background:rgba(232,169,58,.2);color:var(--mustard);}
  .tx-row .tx-right{text-align:right;flex:none;}
  .tx-row .tx-total{font-size:15px;font-weight:800;color:var(--mustard);}
  .tx-row .tx-actions{display:flex;gap:6px;margin-top:6px;}
  .tx-row .tx-actions button{
    border:none;background:var(--bg);color:#D8CBB7;font-size:10.5px;padding:5px 9px;border-radius:8px;font-weight:700;
  }
  .tx-row .tx-actions button.del{color:#E0897A;}

  /* ===== Dashboard ===== */
  .dash-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .dash-card{
    background:linear-gradient(155deg,var(--bg-alt),#20190F);border:1px solid var(--line-soft);
    border-radius:16px;padding:14px;
  }
  .dash-card .l{font-size:11px;color:#B7A98F;font-weight:700;}
  .dash-card .v{font-size:21px;font-weight:800;color:var(--surface);margin-top:4px;}
  .dash-card .v.gold{color:var(--mustard);}
  .dash-card .sub{font-size:10.5px;color:#8A7B69;margin-top:2px;}

  .dash-section{margin-top:20px;}
  .dash-section h3{font-size:13.5px;margin:0 0 10px;color:var(--surface);font-weight:800;}
  .rank-list{display:flex;flex-direction:column;gap:8px;}
  .rank-row{display:flex;align-items:center;gap:10px;background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;}
  .rank-row .pos{
    width:24px;height:24px;border-radius:8px;background:var(--mustard);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;
  }
  .rank-row.worst .pos{background:#6B5D4F;color:#fff;}
  .rank-row .info{flex:1;min-width:0;}
